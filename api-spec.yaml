openapi: 3.1.0
info:
  title: Adler AI Clinical API (draft)
  version: 0.1.0
  description: >
    Endpoints iniciais para pacientes, medicações e farmacogenética (PGx) usados pelo front.
servers:
  - url: https://api.adler.ai/v1
paths:
  /patients/{patientId}/medications:
    get:
      summary: Listar medicações ativas e histórico resumido.
      parameters:
        - in: path
          name: patientId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  medications:
                    type: array
                    items:
                      $ref: "#/components/schemas/Medication"
  /patients/{patientId}/pgx-orders:
    get:
      summary: Listar ordens PGx do paciente.
      parameters:
        - in: path
          name: patientId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/PgxOrder"
    post:
      summary: Criar ordem PGx
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                labId: { type: string }
                consentId: { type: string }
                sampleType: { type: string, enum: [saliva, sangue] }
                comments: { type: string }
      responses:
        "201":
          description: Ordem criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PgxOrder"
  /patients/{patientId}/pgx-results:
    get:
      summary: Resultados de farmacogenética disponíveis.
      parameters:
        - in: path
          name: patientId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/PgxResult"
  /patients/{patientId}/graph-snapshots:
    get:
      summary: Snapshots de rede clínica por data.
      parameters:
        - in: path
          name: patientId
          required: true
          schema: { type: string }
        - in: query
          name: date
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      $ref: "#/components/schemas/GraphNode"
                  links:
                    type: array
                    items:
                      $ref: "#/components/schemas/GraphLink"
components:
  schemas:
    Medication:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        dose: { type: string }
        route: { type: string }
        schedule: { type: string }
        startDate: { type: string, format: date }
        adherence: { type: string }
        target: { type: string }
        notes: { type: string }
    PgxOrder:
      type: object
      properties:
        id: { type: string }
        patientId: { type: string }
        labId: { type: string }
        status: { type: string, enum: [requested, collecting, processing, ready, canceled] }
        eta: { type: string }
        sampleId: { type: string }
        createdAt: { type: string, format: date-time }
    PgxResult:
      type: object
      properties:
        id: { type: string }
        orderId: { type: string }
        gene: { type: string }
        phenotype: { type: string }
        severity: { type: string, enum: [low, med, high] }
        implication: { type: string }
        recommendation: { type: string }
        medications:
          type: array
          items: { type: string }
    GraphNode:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        type: { type: string, enum: [mood, symptom, med, event] }
        x: { type: number }
        y: { type: number }
        intensity: { type: number }
    GraphLink:
      type: object
      properties:
        source: { type: string }
        target: { type: string }
        weight: { type: number }
        type: { type: string, enum: [mood, symptom, med, event] }
